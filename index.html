<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e9ded7">
<link rel="manifest" href="./manifest.webmanifest">
<title>GoalDay Personal</title>
<style>
:root{--bg:#f8f6f2;--bar:#e9ded7;--ink:#171717;--muted:#aaa5a1;--line:#ddd6d0;--accent:#efd47b;--nav:#e9ded7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#111}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit}
.app{height:100%;max-width:520px;margin:auto;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}.top{height:72px;background:var(--bar);display:flex;align-items:end;padding:0 18px 13px;gap:14px;flex-shrink:0}.top button{font-size:18px;color:#aaa}.top button.active{color:#111;font-weight:700}.sep{color:#aaa}.view{flex:1;min-height:0;overflow:auto;position:relative}.nav{height:76px;background:var(--nav);display:flex;flex-shrink:0;border-top:1px solid #0000000d}.nav button{width:25%;height:100%;font-size:30px;display:flex;align-items:center;justify-content:center}.nav button.active{font-weight:700}
.week{height:100%;display:grid;grid-template-columns:55% 45%;overflow:hidden}.days{overflow:auto}.day{min-height:112px;border-bottom:1px solid var(--line);position:relative;padding:18px}.day .date{font-size:32px;line-height:1}.day .dow{font-size:15px;margin-top:4px}.day.today .date{background:#050505;color:#fff;border-radius:13px;padding:7px 10px;display:inline-block}.daytask{position:absolute;left:115px;right:7px;top:48px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sq{display:inline-block;width:18px;height:18px;border:1px solid var(--accent);border-radius:50%;vertical-align:-3px;margin-right:6px}.daytask.done{text-decoration:line-through;color:#c9ae55}.todos{border-left:1px solid var(--line);overflow:auto;padding:18px 11px}.list-select{border:1px solid #d7d0ca;border-radius:13px;padding:10px;background:#ffffff99;display:flex;align-items:center;gap:8px;font-size:15px;position:sticky;top:0;z-index:3}.dot{width:17px;height:17px;border-radius:50%;flex:none}.todo{padding:10px 4px;font-size:16px;display:flex;gap:7px}.todo .box{width:8px;height:8px;background:var(--accent);margin-top:8px;flex:none}.todo.done{color:#aaa;text-decoration:line-through}.todo-text{flex:1}.list-menu{position:absolute;right:10px;top:65px;background:#fff;border-radius:18px;box-shadow:0 10px 35px #0002;z-index:20;width:245px;overflow:hidden}.list-menu button{display:block;width:100%;text-align:left;padding:15px;border-bottom:1px solid #eee}.fab{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:#efe6df;font-size:30px;box-shadow:0 8px 25px #0002}.calendar{padding:20px}.cal-head{display:flex;justify-content:space-between;font-size:21px;font-weight:700;margin-bottom:18px}.cal-head button{font-size:30px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.wd{color:#aaa;font-size:13px}.grid button{height:44px;border-radius:50%;font-size:17px}.grid button.sel{background:#ef646b;color:#fff}.palette{padding:25px}.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.swatch{height:105px;border-radius:18px;overflow:hidden;border:2px solid transparent}.swatch.sel{border-color:#111}.book-wrap{height:100%;background:#f2eee7;display:flex;flex-direction:column}.book-title{text-align:center;font-size:25px;font-weight:700;padding:18px 0 8px}.book-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.book{width:94%;height:min(70vh,600px);display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 14px 22px #0002);position:relative}.page{background:#fffdf9;padding:25px 18px;overflow:hidden;position:relative}.page.left{border-radius:18px 3px 3px 18px;border-right:1px solid #e4ded6}.page.right{border-radius:3px 18px 18px 3px}.page h1{font-size:25px;margin:10px 0 18px}.rule{height:1px;background:#ddd6d0;margin:18px 0}.book-controls{height:62px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.book-controls button{font-size:28px}.note-editor{position:absolute;inset:0;background:#f8f6f2;z-index:50;padding:22px}.note-editor textarea{width:100%;height:calc(100% - 55px);border:0;outline:0;background:transparent;font-size:19px;line-height:1.7;resize:none}.note-editor .save{position:absolute;right:16px;top:12px;background:#fff;border-radius:12px;padding:10px 20px;box-shadow:0 5px 20px #0002}
.error{height:100%;padding:30px 22px;font-size:16px;line-height:1.6}.error b{font-size:20px}
</style></head>
<body><div class="app"><header class="top" id="top"></header><main class="view" id="view"></main><nav class="nav"><button data-nav="week">◉</button><button data-nav="palette">◌</button><button data-nav="calendar">▦</button><button data-nav="journal">▢</button></nav></div>
<script>
(function(){
'use strict';
const KEY='goalday-personal-v2';
const themes=[['奶油','#f8f6f2','#e9ded7','#efd47b'],['夜间','#1f2023','#292b30','#a6a9b8'],['樱粉','#fff8fa','#f5dfe6','#ee9ab6'],['纸张','#ead1ad','#d9b486','#f0d36e']];
const defaultState=()=>({nav:'week',theme:0,list:0,selected:'2026-09-16',lists:[{name:'9月｜每天一件幸福的小事',color:'#efd47b',items:['给月末的自己写一封信','存一笔钱','整理衣柜','看一部综艺','看一本新书 📖','喝一杯秋季限定饮品','黄昏骑行','逛一次市集','教师节，感谢老师','清理一波关注的…','记录本月3件有感…','换一套新的床上用品','买一套新衣服','拍一场日落','养成一个好习惯','做一次全面护肤','买一本喜欢的书','听播客','睡前养生泡脚','吃月饼 🥮','打卡小众书店','菜市场买菜','自制蜂蜜柚子茶','练字静心'],done:[]},{name:'日程指南',color:'#f29db2',items:['安排本周重要事项','整理课程表','预留休息时间'],done:[]},{name:'清单指南',color:'#35584f',items:['牛奶','水果','洗衣液','纸巾','日用品','书籍','礼物','药品','零食','充电线','电池','雨伞'],done:[0,2]}],placed:{},notes:{}});
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState()}catch(e){state=defaultState()}
if(!state.lists||!Array.isArray(state.lists))state=defaultState(); if(!state.placed)state.placed={}; if(!state.notes)state.notes={};
const $=s=>document.querySelector(s); const view=$('#view');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function applyTheme(){const t=themes[state.theme]||themes[0];document.documentElement.style.setProperty('--bg',t[1]);document.documentElement.style.setProperty('--bar',t[2]);document.documentElement.style.setProperty('--nav',t[2]);document.documentElement.style.setProperty('--accent',t[3])}
function date(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function week(s){const d=date(s),day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderTop(){const names=state.nav==='journal'?['日程','记录','清单','38周']:['38周','记录','清单','习惯'];$('#top').innerHTML=names.map((n,i)=>`<button class="${(state.nav==='journal'?i===3:i===0)?'active':''}">${n}${i===0?' ▾':''}</button>${i<3?'<span class="sep">|</span>':''}`).join('')}
function renderWeek(){const days=week(state.selected),list=state.lists[state.list]||state.lists[0];let rows=days.map(s=>{const d=date(s),p=state.placed[s],l=p&&state.lists[p.list]||list,txt=p&&l.items[p.index],done=p&&l.done.includes(p.index);return `<div class="day ${s===state.selected?'today':''}" data-day="${s}"><div class="date">${d.getDate()}</div><div class="dow">${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}</div>${txt?`<div class="daytask ${done?'done':''}"><span class="sq">${done?'✓':''}</span>${esc(txt)}</div>`:''}</div>`}).join('');view.innerHTML=`<div class="week"><section class="days">${rows}</section><aside class="todos"><div class="list-select" id="listSelect"><span class="dot" style="background:${list.color}"></span><span>${esc(list.name)}</span><span style="margin-left:auto">⌄</span></div>${list.items.map((x,i)=>`<div class="todo ${list.done.includes(i)?'done':''}" data-item="${i}"><span class="box"></span><span class="todo-text">${esc(x)}</span></div>`).join('')}</aside></div><button class="fab" id="add">＋</button>`;
$('#listSelect').onclick=()=>{const box=document.createElement('div');box.className='list-menu';box.innerHTML=state.lists.map((l,i)=>`<button data-i="${i}">${i===state.list?'✓ ':''}${esc(l.name)}</button>`).join('');view.appendChild(box);box.onclick=e=>{const b=e.target.closest('button');if(b){state.list=+b.dataset.i;save();render()}}};
view.querySelectorAll('.todo').forEach(el=>el.onclick=()=>{const i=+el.dataset.item;if(list.done.includes(i))list.done=list.done.filter(x=>x!==i);else list.done.push(i);save();render()});
view.querySelectorAll('.day').forEach(el=>el.onclick=()=>{const s=el.dataset.day;const i=window.prompt('输入清单序号（0开始），例如 11；取消则不添加');if(i!==null&&i.trim()!==''){const n=Number(i);if(Number.isInteger(n)&&n>=0&&n<list.items.length){state.placed[s]={list:state.list,index:n};state.selected=s;save();render()}}});
$('#add').onclick=()=>{const x=window.prompt('新增清单事项');if(x){list.items.push(x);save();render()}}}
function renderPalette(){view.innerHTML='<div class="palette"><h2>主题颜色</h2><p>选择手帐颜色</p><div class="swatches">'+themes.map((t,i)=>`<button class="swatch ${i===state.theme?'sel':''}" data-theme="${i}" style="background:${t[1]}"><div style="height:32px;background:${t[2]}"></div><div style="padding:18px;text-align:left">${t[0]}</div></button>`).join('')+'</div></div>';view.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=+b.dataset.theme;save();render()})}
function renderCalendar(){const d=date(state.selected),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<start;i++)c+='<span></span>';for(let i=1;i<=total;i++){const s=iso(new Date(y,m,i));c+=`<button class="${s===state.selected?'sel':''}" data-date="${s}">${i}</button>`}view.innerHTML=`<div class="calendar"><div class="cal-head"><span>${y}年 ${m+1}月</span><span><button id="prev">‹</button><button id="next">›</button></span></div><div class="grid">${['周一','周二','周三','周四','周五','周六','周日'].map(x=>`<div class="wd">${x}</div>`).join('')}${c}</div></div>`;view.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.date;state.nav='week';save();render()});$('#prev').onclick=()=>{state.selected=iso(new Date(y,m-1,1));renderCalendar()};$('#next').onclick=()=>{state.selected=iso(new Date(y,m+1,1));renderCalendar()}}
let page=0;
function editNote(s){const o=document.createElement('div');o.className='note-editor';o.innerHTML=`<button class="save">保存</button><textarea>${esc(state.notes[s]||'')}</textarea>`;view.appendChild(o);o.querySelector('.save').onclick=()=>{state.notes[s]=o.querySelector('textarea').value;save();render()}}
function renderJournal(){const ds=week(state.selected),s=ds[Math.max(0,page-1)]||ds[0],d=date(s),note=state.notes[s]||'';let left,right;if(page===0){left='<div>9月｜第38周</div><h1>本周概览</h1>';right='<div>2026年</div><h1>这一周</h1><div class="rule"></div><p>左右翻页查看每天的记录。</p>'}else{left=`<div>${d.getMonth()+1}月${d.getDate()}日</div><h1>${d.getDate()} <small>${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}</small></h1><div class="rule"></div>${note?esc(note).replace(/\n/g,'<br>'):'<p style="color:#cfc9c2;text-align:center;margin-top:70px">点击页面开始记录</p>'}`;right='<div>当日记录</div><h1>今日</h1><div class="rule"></div><p style="color:#aaa">清单事项会显示在这里。</p>'}view.innerHTML=`<div class="book-wrap"><div class="book-title">${page===0?'9月':'日记'}</div><div class="book-stage"><div class="book"><article class="page left" id="pageL">${left}</article><article class="page right" id="pageR">${right}</article></div></div><div class="book-controls"><button id="back">‹</button><b>${page===0?'2026':'第'+page+'页'}</b><button id="forward">›</button></div></div>`;$('#pageL').onclick=()=>editNote(s);$('#pageR').onclick=()=>editNote(s);$('#back').onclick=()=>{page=Math.max(0,page-1);renderJournal()};$('#forward').onclick=()=>{page=Math.min(7,page+1);renderJournal()}}
function render(){applyTheme();renderTop();try{if(state.nav==='week')renderWeek();else if(state.nav==='palette')renderPalette();else if(state.nav==='calendar')renderCalendar();else if(state.nav==='journal')renderJournal();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.nav))}catch(e){view.innerHTML=`<div class="error"><b>页面初始化遇到小问题</b><br>请刷新一次；如果仍然空白，把这个页面截图发给我。<br><br><small>${esc(e&&e.message||e)}</small></div>`;console.error(e)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.nav=b.dataset.nav;save();render()});
render();
})();
</script>
</body></html>
